name: conformance evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-paired-members:
    name: macOS signed members-plan lookup
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Run the paired Machine and HQ reader
        run: node --test tests/paired-members-plans.test.mjs
  macos-quickstart:
    name: macOS owner quickstart
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Exercise the quickstart and chat CLI on macOS
        run: node --test tests/quickstart.test.mjs
      - name: Run hello.soul on macOS
        run: npm run quickstart -- --out reports/quickstart-macos.json
      - name: Verify native cooperative evidence
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { validateQuickstartReport } from './lib/quickstart-report.mjs';
          const report = JSON.parse(readFileSync('reports/quickstart-macos.json'));
          validateQuickstartReport(report);
          assert.equal(report.outcome, 'pass');
          assert.equal(report.host.os, 'darwin');
          assert.equal(report.enforcement_profile.in_force, 'managed-cooperative');
          JS
      - name: Retain the macOS report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-owner-quickstart
          path: reports/quickstart-macos.json
          if-no-files-found: error
  t14:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Fetch and verify pinned anonymous inputs
        run: npm run prepare:pins
      - name: Harness mutation and integrity controls
        run: npm test
      - name: T14 evidence against fresh platform main
        run: node suites/T14-version-mismatch/run.mjs --out reports/T14-latest.json
      - name: Stage 1 T04 T05 T20 evidence
        run: node suites/stage1/run.mjs --out reports/stage1-latest.json
      - name: Runnable hello.soul quickstart evidence
        run: node suites/quickstart/run.mjs --out reports/quickstart-latest.json
      - name: Verify implemented checks and honest policy outcome
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { validateInventory } from './lib/inventory.mjs';
          import { policyVerdict } from './lib/platform.mjs';
          import { validateStage1Report } from './lib/stage1-report.mjs';
          import { validateQuickstartReport } from './lib/quickstart-report.mjs';
          const t14 = JSON.parse(readFileSync('reports/T14-latest.json'));
          validateInventory({ ...t14, outcome: t14.implemented_checks });
          assert.equal(t14.implemented_checks, 'pass');
          const policy = policyVerdict(t14.platform_context, t14.protocol_current);
          assert.equal(t14.outcome, policy.status === 'satisfied' ? 'pass' : 'blocked');
          assert.equal(t14.compatibility_policy.n_minus_1, policy.n_minus_1);
          const stage1 = JSON.parse(readFileSync('reports/stage1-latest.json'));
          validateStage1Report(stage1);
          assert.equal(stage1.outcome, 'pass');
          assert.equal(stage1.suite_revision.clean, true);
          const quickstart = JSON.parse(readFileSync('reports/quickstart-latest.json'));
          validateQuickstartReport(quickstart);
          assert.equal(quickstart.outcome, 'pass');
          assert.equal(quickstart.suite_revision.clean, true);
          JS
      - name: Run the native Linux two-account binding and restart check
        run: bash suites/stage2a/hosted-linux.sh
      - name: Retain the exact-run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conformance-evidence
          path: |
            reports/T14-latest.json
            reports/stage1-latest.json
            reports/quickstart-latest.json
            reports/stage2a-linux.json
          if-no-files-found: error
