name: T14 current-major evidence (policy gate remains blocked)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  current-major:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Fetch and verify immutable anonymous source archives
        run: npm run prepare:dependencies
      - name: Run independent negative controls
        run: npm test
      - name: Produce current-major evidence against fresh platform main
        run: npm run t14
      - name: Assert the report does not claim complete T14 acceptance
        run: node -e 'const r = require("./reports/T14-latest.json"); if (r.outcome.implemented !== "passed" || r.outcome.overallT14 !== "blocked" || !r.outcome.policyBlocked) process.exit(1)'
      - name: Retain the exact-run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: T14-current-major-evidence
          path: reports/T14-latest.json
          if-no-files-found: error
