name: conformance evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t14:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Fetch and verify pinned anonymous inputs
        run: npm run prepare:pins
      - name: Harness mutation and integrity controls
        run: npm test
      - name: T14 evidence against fresh platform main
        run: node suites/T14-version-mismatch/run.mjs --out reports/T14-latest.json
      - name: Stage 1 T04 T05 T20 evidence
        run: node suites/stage1/run.mjs --out reports/stage1-latest.json
      - name: Runnable hello.soul quickstart
        run: node templates/hello.soul/run.mjs --out reports/hello-soul-latest.json
      - name: Verify implemented checks and honest policy outcome
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { validateInventory } from './lib/inventory.mjs';
          import { policyVerdict } from './lib/platform.mjs';
          import { validateStage1Report } from './lib/stage1-report.mjs';
          import { validateHelloSoulReport } from './lib/hello-soul-report.mjs';
          const t14 = JSON.parse(readFileSync('reports/T14-latest.json'));
          validateInventory({ ...t14, outcome: t14.implemented_checks });
          assert.equal(t14.implemented_checks, 'pass');
          const policy = policyVerdict(t14.platform_context, t14.protocol_current);
          assert.equal(t14.outcome, policy.status === 'satisfied' ? 'pass' : 'blocked');
          assert.equal(t14.compatibility_policy.n_minus_1, policy.n_minus_1);
          const stage1 = JSON.parse(readFileSync('reports/stage1-latest.json'));
          validateStage1Report(stage1);
          assert.equal(stage1.outcome, 'pass');
          assert.equal(stage1.suite_revision.clean, true);
          const quickstart = JSON.parse(readFileSync('reports/hello-soul-latest.json'));
          validateHelloSoulReport(quickstart);
          assert.equal(quickstart.outcome, 'pass');
          assert.equal(quickstart.suite_revision.clean, true);
          JS
      - name: Retain the exact-run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conformance-evidence
          path: |
            reports/T14-latest.json
            reports/stage1-latest.json
            reports/hello-soul-latest.json
          if-no-files-found: error
